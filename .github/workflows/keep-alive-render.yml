name: Keep Render JLM TV H24 Awake

on:
  schedule:
    # Exécute un ping externe toutes les 10 minutes pour empêcher la mise en veille Render Free Tier (timeout 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping JLM Television H24 Health Endpoint
        env:
          TARGET_URL: ${{ vars.RENDER_APP_URL || 'https://jlm-tv.onrender.com' }}
        run: |
          echo "Envoi du signal anti-veille vers ${TARGET_URL}/api/health ..."
          HTTP_STATUS=$(curl -s -L -o /tmp/health.json -w "%{http_code}" --max-time 45 "${TARGET_URL}/api/health?source=github-actions")
          cat /tmp/health.json || true
          echo ""
          echo "Statut HTTP reçu : ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Instance Render active et synchronisée."
          else
            echo "Avertissement : code HTTP ${HTTP_STATUS}"
            exit 1
          fi
